name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      # 1. Avval pnpm o'rnatiladi (cache ishlashi uchun)
      - name: pnpm o'rnatish
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # 2. Keyin Node.js va pnpm cache sozlanadi
      - name: Node.js muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # --- 1. BACKEND VA FRONTEND NI LOKAL BUILD QILISH (GITHUB RUNNER-DA) ---
      - name: Backend dependencies va Build
        run: |
          cd backend
          pnpm install
          pnpm run build

      - name: Frontend dependencies va Build
        run: |
          cd frontend
          pnpm install
          pnpm run build

      # --- 2. TAYYOR FAYLLARNI SERVERGA YUBORISH VA MIGRATSIYA ---
      - name: Build qilingan fayllarni serverga yuborish va PM2 ni yangilash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd /root/imthon_5/gap
            git pull origin main
            
            # Backend dependencies production uchun
            cd backend
            pnpm install --prod
            
            # Prisma migratsiya
            export DATABASE_URL="postgresql://postgres:1234@localhost:5432/gap"
            pnpm exec prisma generate
            pnpm exec prisma migrate deploy
            
            # PM2 ni qayta ishga tushirish
            pm2 restart backend-api --update-env || pm2 start dist/main.js --name "backend-api"

      - name: Frontend static fayllarini serverga yuborish (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend/dist/*"
          target: "/root/imthon_5/gap/frontend/dist"
          strip_components: 2