name: CI/CD Deployment

on:
  push:
    branches:
      - main  # main tarmog'iga push qilinganda ishga tushadi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      # --- 1. BACKEND DEPLOYMENT & DATABASE MIGRATE ---
      - name: Serverga ulanish va Backend-ni yangilash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd /root/imthon_5/gap
            git pull origin main
            
            cd backend
            pnpm install --frozen-lockfile || pnpm install
            
            # Prisma .env ichidagi DB_URL ni o'qishi uchun vaqtincha export qilamiz
            export DATABASE_URL="postgresql://postgres:1234@localhost:5432/gap"
            
            pnpm exec prisma generate
            pnpm exec prisma migrate deploy
            
            pnpm run build
            
            # PM2 orqali ilovani qayta ishga tushirish
            pm2 restart backend-api --update-env || pm2 start dist/main.js --name "backend-api"

      # --- 2. FRONTEND BUILD & DEPLOYMENT ---
      - name: Node.js muhitini sozlash (Frontend uchun)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: pnpm o'rnatish
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Frontend-ni lokal build qilish
        run: |
          cd frontend
          pnpm install
          pnpm run build

      - name: Build bo'lgan fayllarni serverga yuborish (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend/dist/*"
          target: "/root/imthon_5/gap/frontend/dist"
          strip_components: 2