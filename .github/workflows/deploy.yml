name: CI/CD Deployment (npm)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      # Serverga ulanib hammasini to'g'ridan-to'g'ri serverda bajaramiz
      - name: Serverda kodni yangilash, build qilish va PM2 orqali ishga tushirish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd /root/imthon_5/gap
            git pull origin main
            
            # --- 1. BACKEND DEPLOYMENT ---
            cd backend
            npm install
            
            export NODE_OPTIONS="--max-old-space-size=512"
            npm run build
            
            export DATABASE_URL="postgresql://postgres:1234@localhost:5432/gap"
            npx prisma generate
            npx prisma migrate deploy
            
            pm2 restart backend-api --update-env || pm2 start dist/src/main.js --name "backend-api"
            
            # --- 2. FRONTEND DEPLOYMENT ---
            cd ../frontend
            npm install
            npm run build
            
            # Frontend Next.js bo'lgani uchun PM2 orqali start beramiz (portlari to'qnashmasligi uchun 3000 yoki boshqa portda)
            pm2 restart frontend-app --update-env || pm2 start npm --name "frontend-app" -- start -- -p 3000