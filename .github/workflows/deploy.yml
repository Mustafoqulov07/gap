name: CI/CD Deployment (npm)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- 1. BACKEND VA FRONTEND NI GITHUB RUNNER-DA BUILD QILISH ---
      - name: Backend dependencies va Build
        run: |
          cd backend
          npm install
          npm run build

      - name: Frontend dependencies va Build
        run: |
          cd frontend
          npm install
          npm run build

      # --- 2. BACKEND DIST FAYLLARINI SERVERGA YUBORISH (SCP) ---
      - name: Backend build fayllarini serverga yuborish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/dist/*"
          target: "/root/imthon_5/gap/backend/dist"
          strip_components: 2

      # --- 3. SERVERDA GIT PULL, MIGRATSIYA VA PM2 ISHGA TUSHIRISH ---
      - name: Serverda kodni yangilash, migratsiya va PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd /root/imthon_5/gap
            git pull origin main
            
            cd backend
            npm install --production
            
            export DATABASE_URL="postgresql://postgres:1234@localhost:5432/gap"
            npx prisma generate
            npx prisma migrate deploy
            
            pm2 restart backend-api --update-env || pm2 start dist/src/main.js --name "backend-api"

      # --- 4. FRONTEND STATIC FAYLLARNI SERVERGA YUBORISH (SCP) ---
      - name: Frontend static fayllarini serverga yuborish (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend/dist/*"
          target: "/root/imthon_5/gap/frontend/dist"
          strip_components: 2