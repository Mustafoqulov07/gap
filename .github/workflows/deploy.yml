name: CI/CD Deployment (npm)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      # Faqat Frontend-ni GitHub runner-da build qilamiz (chunki u yengil va tez)
      - name: Node.js muhitini sozlash (Frontend uchun)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend build qilish
        run: |
          cd frontend
          npm install
          npm run build

      # Frontend static fayllarini serverga yuborish (SCP)
      - name: Frontend static fayllarini serverga yuborish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend/dist/*"
          target: "/root/imthon_5/gap/frontend/dist"
          strip_components: 2

      # Serverga ulanib Backend-ni yangilash, RAM limitini berib build qilish va PM2 ni ishga tushirish
      - name: Serverda Backend build, migratsiya va PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd /root/imthon_5/gap
            git pull origin main
            
            cd backend
            npm install
            
            # Server RAM yetishmay qolmasligi uchun maxsus limit beramiz
            export NODE_OPTIONS="--max-old-space-size=512"
            npm run build
            
            export DATABASE_URL="postgresql://postgres:1234@localhost:5432/gap"
            npx prisma generate
            npx prisma migrate deploy
            
            pm2 restart backend-api --update-env || pm2 start dist/src/main.js --name "backend-api"