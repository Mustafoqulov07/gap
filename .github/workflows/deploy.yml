name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      # --- 1. BACKEND DEPLOYMENT ---
      - name: Serverga ulanish va Backend-ni yangilash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true # Xatolik chiqsa, to'xtatish uchun
          script: |
            cd /root/imthon_5/gap
            git pull origin main
            
            cd backend
            # pnpm ni tezroq va muammosiz o'rnatish uchun
            pnpm install --frozen-lockfile || pnpm install
            pnpm run build
            pnpm exec prisma migrate deploy
            
            # PM2 orqali ishga tushirish (agar allaqachon ishlayotgan bo'lsa restart, yo'qsa start)
            pm2 restart backend-api || pm2 start dist/main.js --name "backend-api"

      # --- 2. FRONTEND BUILD VA DEPLOYMENT ---
      - name: Node.js muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: pnpm-ni o'rnatish
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Frontend-ni lokal build qilish
        run: |
          cd frontend
          pnpm install
          pnpm run build

      - name: Build bo'lgan static fayllarni serverga yuklash (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend/dist/*"
          target: "/root/imthon_5/gap/frontend/dist"
          strip_components: 2